syntax = "proto3";

option csharp_namespace = "OrderOrchestration.Api.Fraud";

package fraud;

service FraudService {
  rpc CheckFraud (FraudCheckRequest) returns (FraudCheckResponse);
}

message FraudCheckRequest {
  string order_id = 1;
  string user_id = 2;
  double total_amount = 3;
}

enum FraudDecision {
  FRAUD_DECISION_UNSPECIFIED = 0;
  APPROVED = 1;
  REJECTED = 2;
  MANUAL_REVIEW = 3;
}

message FraudCheckResponse {
  // Conservado por compatibilidad; usar 'decision' como fuente de verdad.
  bool is_approved = 1;
  string reason = 2;
  FraudDecision decision = 3;
}
