apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
  namespace: order-orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core
  template:
    metadata:
      labels:
        app: core
    spec:
      # Init container que espera a que Postgres y Mongo estén disponibles antes de arrancar.
      # La aplicación aplica las migraciones de EF Core al iniciar (ver Program.cs); para un
      # esquema de migración dedicado puede sustituirse por un init container con un EF bundle
      # (dotnet ef migrations bundle) que ejecute las migraciones contra Postgres.
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - >
              until nc -z postgres 5432; do echo "esperando postgres..."; sleep 2; done;
              until nc -z mongo 27017; do echo "esperando mongo..."; sleep 2; done;
              echo "dependencias listas";
      containers:
        - name: core
          image: oo-core:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: oo-config
            - secretRef:
                name: oo-secrets
          readinessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "150m"
              memory: "192Mi"
            limits:
              cpu: "750m"
              memory: "384Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: core
  namespace: order-orchestration
spec:
  selector:
    app: core
  ports:
    - port: 8080
      targetPort: 8080
